---
- name: Get devices from SD-WAN Manager
  hosts: local
  gather_facts: false

  vars:
    my_payload:
      group:
        - "netadmin"
      description: "New user created via Ansible"
      userName: "sdwannewuser"
      password: "sdwannewuser123"

  tasks:
    - name: "Task 1 - Login to Manager"
      ansible.builtin.uri:
        url: "{{ vmanage_base_url }}/j_security_check"
        method: POST
        body_format: form-urlencoded
        body:
          j_username: "{{ vmanage_username }}"
          j_password: "{{ vmanage_password }}"
        validate_certs: false
      register: login_request
    
    - name: "Task 2 - Capture the Cookie"
      set_fact:
        session_cookie: "{{ login_request.set_cookie }}"
    
    - name: "Task 3 -Retrieve XSRF Token"
      ansible.builtin.uri:
        url: "{{ vmanage_base_url }}/dataservice/client/token"
        method: GET
        headers:
          Cookie: "{{ session_cookie }}"
        validate_certs: false
        return_content: true
      register: token_result

    - name: "Task 4 - Capture the XSRF token"
      set_fact:
        xsrf_token: "{{ token_result.content }}"

    - name: "Task 5 - Create user on Manager"
      ansible.builtin.uri:
        url: "{{ vmanage_base_url }}/dataservice/admin/user"
        method: POST
        validate_certs: false
        headers:
          Content-Type: "application/json"
          Cookie: "{{ session_cookie }}"
          X-XSRF-TOKEN: "{{ xsrf_token }}"
        body_format: json
        body: "{{ my_payload }}"
        status_code:
          - 200
          - 201
          - 202
        return_content: true
      register: add_user_result

    - name: "Task 6 - Show result of user creation"
      debug:
        msg: "{{ add_user_result }}"