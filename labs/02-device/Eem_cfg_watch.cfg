! Blueprint 2.7 — On-box automation (EEM applet)
! Target: IOS-XE c8000v 17.15.04c (Containerlab, 172.30.30.11)
! Applied and verified live on 2026-06-12.
!
! Applet: fires on any config-change syslog and emits its own syslog marker.
! Loop-safe: action emits %HA_EM-6-LOG, which does not match the
! %SYS-5-CONFIG_I trigger pattern.

event manager applet CFG-WATCH
 event syslog pattern "%SYS-5-CONFIG_I"
 action 1.0 syslog msg "CFG-WATCH fired: config change detected"

! Verification:
!   show event manager policy registered
!   show logging | include CFG-WATCH|CONFIG_I
!
! Observed behavior (live):
!   - The config session that CREATES the applet fires it once:
!     registration completes before the session's own CONFIG_I is emitted.
!   - Re-fires on every subsequent config session exit (persistent, not one-shot).
!   - No self-trigger loop (HA_EM-6-LOG != SYS-5-CONFIG_I).